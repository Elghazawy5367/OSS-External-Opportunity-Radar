# OSS-RADAR — Watch Targets (REVISED FINAL)
# Created: 2026-09-23 | Revised: 2026-09-23 (Ahmed deep-vision + audit ritual)
# Status: APPROVED BY AHMED — Stage 2 implements as config/watch-targets.yaml
# Sources: github (REST v3) | hackernews (Algolia) | stackoverflow (Stack Exchange API)
# Reddit removed — API closed May 2026 (WL-R01, DEC-R02)
#
# STRUCTURE: 4 targets covering distinct layers of the income stack + OSS hypothesis.
#   Target 1 — AI Products & Side Income (what to build)
#   Target 2 — Digital Product & Creator Platforms (where to sell)
#   Target 3 — No-Code & Automation for Non-Technical Builders (how to build)
#   Target 4 — OSS Sustainability & Funding Gaps (hypothesis test)
# Each collector reads this file and uses the relevant fields:
#   github-collector  → github_topics, github_search_queries
#   hn-collector      → keywords (searched in HN Algolia)
#   stackoverflow-collector → stackoverflow_tags
# TRENDING: each collector also runs a trending/velocity pass per the settings
#   section — this catches rising signals regardless of keywords.


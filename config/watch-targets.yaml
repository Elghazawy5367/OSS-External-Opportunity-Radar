# ─── GLOBAL SETTINGS ──────────────────────────────────────────────────────
settings:
  max_results_per_query: 30       # per API call, not total
  days_back_github: 7             # search window for issue/PR queries
  days_back_hn: 3                 # HN stories age limit (Algolia)
  days_back_stackoverflow: 30     # widened from 7 — SO volume is very low in 2026
  min_stars_fork_watch: 50        # ignore forks of tiny repos
  min_score_hn: 5                 # minimum HN points to include

  # ─── TRENDING / VELOCITY PASS ─────────────────────────────────────────
  # Each collector ALSO runs a trending pass independent of keyword targets.
  # This catches rising signals that don't match any target's keywords.
  trending:
    enabled: true
    github:
      # GitHub has no official trending API. Use search sorted by stars
      # with created:>YYYY-MM-DD to find repos gaining velocity.
      sort_by: stars               # sort search results by star count
      created_within_days: 30      # only repos created in last 30 days
      min_stars: 100               # minimum stars to surface
      topics_filter:               # limit trending to these broad areas
        - ai
        - saas
        - no-code
        - automation
        - developer-tools
    hackernews:
      # HN Algolia: search by points, sorted by date, no keyword filter.
      # Surfaces the hottest stories in the Radar's observation window.
      min_points: 50               # only stories with 50+ points
      max_results: 20              # top 20 trending stories per run
    stackoverflow:
      # Stack Exchange API: /questions?order=desc&sort=hot&tagged=...
      # Surfaces hot questions across the target tags.
      use_hot_endpoint: true       # hit /questions/hot instead of /questions
      max_results: 20              # top 20 hot questions per run
